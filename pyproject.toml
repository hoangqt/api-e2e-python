[project]
name = "api-e2e-py"
version = "0.1.0"
description = "A simple uv project for testing a subset of the GitHub API using REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "allure-pytest>=2.15.0",
    "black>=25.1.0",
    "hypothesis>=6.148.5",
    "pytest>=8.4.1",
    "pytest-order>=1.3.0",
    "requests>=2.32.5",
    "ruff>=0.12.9",
    "tenacity>=9.1.2",
]
